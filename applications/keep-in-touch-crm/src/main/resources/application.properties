spring.application.name=io.github.gmcnicol.crm
spring.application.version=0.1.0-SNAPSHOT
spring.security.user.name=gareth
spring.security.user.roles=TENANT_tenant-one,PRINCIPAL_Owner
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=${spring.application.version}
management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics,flyway
kernel.telemetry.subject-key=${KERNEL_TELEMETRY_SUBJECT_KEY:${random.uuid}}
kernel.telemetry.subject-key-id=${KERNEL_TELEMETRY_SUBJECT_KEY_ID:ephemeral}

[package]
name = "kernel-cedar"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
cedar-policy = { git = "https://github.com/cedar-policy/cedar", rev = "09e21d967f1da2cf2abbe1e0b0b2067b41867735" }
jni = "=0.21.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
[profile.release]
overflow-checks = true

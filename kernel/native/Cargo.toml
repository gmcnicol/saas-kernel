[package]
name = "kernel-cedar"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
# build.sh materializes exact Cedar 09e21d9 + the fingerprinted bounded patch here.
cedar-policy = { path = "cedar/cedar-policy" }
jni = "=0.21.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
[profile.release]
overflow-checks = true
